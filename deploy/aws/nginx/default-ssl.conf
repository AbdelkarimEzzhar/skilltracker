server {
    listen 80;
    server_name skilltrack.dev www.skilltrack.dev 51.21.63.138;
    return 301 https://skilltrack.dev$request_uri;
}

server {
    listen 443 ssl;
    server_name skilltrack.dev 51.21.63.138;
    client_max_body_size 10m;

    ssl_certificate /etc/letsencrypt/live/skilltrack.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skilltrack.dev/privkey.pem;

    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://backend:5000/health;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
